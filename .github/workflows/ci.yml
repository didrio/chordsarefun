# Checks every push to main and every pull request: lint, tests, typecheck and the
# production build (`npm run check`). Hosting is Cloudflare (Workers Builds, see
# wrangler.jsonc), which builds and deploys main on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # Browser smoke tests: real headless Chrome (preinstalled on ubuntu-latest) drives drags, resize,
  # the ruler and keyboard edits (`e2e/`). Linux uses Ctrl for copy/nudge (e2e/harness.ts).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
